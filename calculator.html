
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณค่าส่ง | ThaiGo Air Express</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172b4d}
.wrap{max-width:520px;margin:25px auto;padding:16px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 24px #0f172a12}
.brand{text-align:center;color:#17365d;font-size:27px;font-weight:bold}
.sub{text-align:center;color:#64748b;margin:8px 0 24px}
label{display:block;font-weight:bold;margin:18px 0 8px}
select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}
.result{margin-top:22px;padding:20px;background:#eff6ff;border-radius:12px;text-align:center}
.price{font-size:30px;font-weight:bold;color:#17365d;margin:10px 0}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#17365d;color:white;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}
.note{font-size:13px;color:#64748b;line-height:1.7;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">📦 ThaiGo Air Express</div>
    <div class="sub">ระบบคำนวณค่าจัดส่งระหว่างประเทศ</div>

    <label for="country">1. เลือกประเทศปลายทาง</label>
    <select id="country">
      <option value="usa">🇺🇸 สหรัฐอเมริกา (USA)</option>
      <option value="australia">🇦🇺 ออสเตรเลีย</option>
      <option value="canada">🇨🇦 แคนาดา</option>
      <option value="hongkong">🇭🇰 ฮ่องกง</option>
      <option value="newzealand">🇳🇿 นิวซีแลนด์</option>
      <option value="singapore">🇸🇬 สิงคโปร์</option>
      <option value="taiwan">🇹🇼 ไต้หวัน</option>
    </select>

    <label for="service">2. เลือกบริการ</label>
    <select id="service">
      <option value="normal">เรทปกติ (7–20 วัน) — สูงสุด 6 กก.</option>
      <option value="express">เรทด่วน (5–7 วัน) — 1–20 กก.</option>
    </select>

    <label for="weight">3. เลือกน้ำหนักพัสดุ</label>
    <select id="weight"></select>

    <div class="result">
      <div>ราคาจัดส่ง</div>
      <div class="price" id="price">กำลังโหลด...</div>
      <div id="delivery"></div>
    </div>

    <button onclick="contactAdmin()">สอบถาม / จองส่งพัสดุ</button>

    <div class="note">
      • ระยะเวลาจัดส่งเป็นเวลาโดยประมาณ<br>
      • ราคาที่แสดงเป็นราคาอ้างอิง กรุณายืนยันกับแอดมินก่อนส่ง<br>
      • ประเทศที่ยังไม่มีตารางราคา กรุณาติดต่อแอดมิน
    </div>
  </div>
</div>

<script>
// ตารางราคาที่ได้รับมา สำหรับสหรัฐอเมริกา
// ก่อนเปิดให้ลูกค้าใช้งานจริง ให้ยืนยันว่าตัวเลขเหล่านี้
// เป็นราคาขายลูกค้าของ ThaiGo ไม่ใช่ต้นทุนพาร์ทเนอร์
const sellingPrices = {
  usa: {
    normal: {
      1: 1858.14, 2: 2642.45, 3: 3289.80,
      4: 3942.50, 5: 4670.10, 6: 5419.10
    },
    express: {
      1: 3122, 2: 3646, 3: 4171, 4: 4794, 5: 5334,
      6: 6390, 7: 7173, 8: 7654, 9: 8133, 10: 8799,
      11: 9139, 12: 9543, 13: 10129, 14: 10469,
      15: 10809, 16: 11019, 17: 11229, 18: 11469,
      19: 12149, 20: 12499
    }
  }
};

const country = document.getElementById("country");
const service = document.getElementById("service");
const weight = document.getElementById("weight");
const price = document.getElementById("price");
const delivery = document.getElementById("delivery");

function updateWeights() {
  const max = service.value === "normal" ? 6 : 20;
  weight.innerHTML = "";

  for (let i = 1; i <= max; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = i + " กิโลกรัม";
    weight.appendChild(option);
  }

  updatePrice();
}

function updatePrice() {
  const countryCode = country.value;
  const amount = sellingPrices[countryCode]?.[service.value]?.[weight.value];

  if (Number.isFinite(amount)) {
    price.textContent = amount.toLocaleString("th-TH", {
      maximumFractionDigits: 2
    }) + " บาท";
  } else {
    price.textContent = "สอบถามราคา";
  }

  const countryName = country.options[country.selectedIndex].text;

  delivery.textContent =
    countryCode !== "usa"
      ? countryName + " • กรุณาสอบถามราคา"
      : countryName + " • " +
        (service.value === "normal"
          ? "เรทปกติ 7–20 วัน"
          : "เรทด่วน 5–7 วัน");
}

function contactAdmin() {
  window.open("https://line.me/R/ti/p/@710rkcan", "_blank");
}

country.addEventListener("change", updatePrice);
service.addEventListener("change", updateWeights);
weight.addEventListener("change", updatePrice);

updateWeights();
</script>
</body>
</html>
