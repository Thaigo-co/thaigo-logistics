
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณค่าส่ง | ThaiGo Air Express</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Leelawadee UI","Tahoma","Noto Sans Thai",sans-serif;
  color:#183153;
  background:linear-gradient(145deg,#eaf2ff,#f8fafc 55%,#fff0f1);
  min-height:100vh;
}

.wrap{max-width:520px;margin:auto;padding:28px 16px}

.card{
  background:#fff;
  border:1px solid #e3eaf3;
  border-radius:24px;
  padding:24px;
  box-shadow:0 14px 38px rgba(23,54,93,.12);
}

.brand{
  text-align:center;
  font-size:29px;
  font-weight:800;
  color:#17365d;
  letter-spacing:-.5px;
}

.brand span{color:#dc2626}

.sub{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin:8px 0 24px;
}

.tag{
  text-align:center;
  font-size:12px;
  color:#17365d;
  background:#eff6ff;
  border-radius:20px;
  padding:7px 12px;
  display:table;
  margin:0 auto 22px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  margin:20px 0 9px;
  color:#17365d;
}

select{
  display:block;
  width:100%;
  padding:14px 12px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  background:#fff;
  color:#183153;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.result{
  margin-top:25px;
  padding:23px 15px;
  border-radius:18px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#17365d,#2459a6);
}

.result-label{font-size:14px;color:#dbeafe}

.price{
  font-size:36px;
  font-weight:800;
  margin:12px 0;
  overflow-wrap:anywhere;
}

#delivery{font-size:13px;color:#e2e8f0;line-height:1.7}

button{
  display:block;
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#dc2626;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  margin-top:18px;
  cursor:pointer;
}

button:hover{background:#b91c1c}

.note{
  font-size:12px;
  color:#64748b;
  line-height:1.9;
  margin-top:20px;
  padding-top:14px;
  border-top:1px solid #e2e8f0;
}

.footer{text-align:center;font-size:12px;color:#64748b;margin-top:18px}

@media(max-width:380px){
  .card{padding:18px}
  .brand{font-size:25px}
  .price{font-size:31px}
}
</style>
</head>

<body>
<div class="wrap">
  <main class="card">
    <div class="brand">📦 Thai<span>Go</span> Air Express</div>
    <div class="sub">บริการจัดส่งพัสดุจากไทยไปต่างประเทศ</div>
    <div class="tag">✈️ คำนวณค่าส่งเบื้องต้นได้ด้วยตัวเอง</div>

    <label for="country">1. ประเทศปลายทาง</label>
    <select id="country">
      <option value="usa">🇺🇸 สหรัฐอเมริกา (USA)</option>
      <option value="australia">🇦🇺 ออสเตรเลีย</option>
      <option value="canada">🇨🇦 แคนาดา</option>
      <option value="hongkong">🇭🇰 ฮ่องกง</option>
      <option value="newzealand">🇳🇿 นิวซีแลนด์</option>
      <option value="singapore">🇸🇬 สิงคโปร์</option>
      <option value="taiwan">🇹🇼 ไต้หวัน</option>
    </select>

    <label for="service">2. ประเภทบริการ</label>
    <select id="service">
      <option value="normal">เรทปกติ · 7–20 วัน · สูงสุด 6 กก.</option>
      <option value="express">เรทด่วน · 5–7 วัน · 1–20 กก.</option>
    </select>

    <label for="weight">3. น้ำหนักพัสดุ</label>
    <select id="weight"></select>

    <section class="result">
      <div class="result-label">ราคาจัดส่งเบื้องต้น</div>
      <div class="price" id="price">กำลังโหลด...</div>
      <div id="delivery"></div>
    </section>

    <button type="button" id="contactButton">
      สอบถาม / จองส่งพัสดุทาง LINE
    </button>

    <div class="note">
      • ระยะเวลาจัดส่งเป็นเวลาโดยประมาณ<br>
      • ประเทศที่ยังไม่มีตารางราคา กรุณาติดต่อแอดมิน<br>
      • โปรดยืนยันราคาและเงื่อนไขสินค้าก่อนจัดส่ง
    </div>
  </main>
  <div class="footer">ThaiGo Air Express · ส่งพัสดุจากไทยไปต่างประเทศ</div>
</div>

<script>
const prices = {
  usa: {
    normal: {
      1:1858.14,
      2:2642.45,
      3:3289.80,
      4:3942.50,
      5:4670.10,
      6:5419.10
    },
    express: {
      1:3122,
      2:3646,
      3:4171,
      4:4794,
      5:5334,
      6:6390,
      7:7173,
      8:7654,
      9:8133,
      10:8799,
      11:9139,
      12:9543,
      13:10129,
      14:10469,
      15:10809,
      16:11019,
      17:11229,
      18:11469,
      19:12149,
      20:12499
    }
  }
};

const country = document.getElementById("country");
const service = document.getElementById("service");
const weight = document.getElementById("weight");
const price = document.getElementById("price");
const delivery = document.getElementById("delivery");

function updateWeights(){
  const max = service.value === "normal" ? 6 : 20;
  weight.innerHTML = "";

  for(let i=1;i<=max;i++){
    const option = document.createElement("option");
    option.value = String(i);
    option.textContent = i + " กิโลกรัม";
    weight.appendChild(option);
  }

  updatePrice();
}

function updatePrice(){
  const countryCode = country.value;
  const amount = prices[countryCode]?.[service.value]?.[weight.value];

  if(typeof amount === "number" && Number.isFinite(amount)){
    price.textContent = amount.toLocaleString("th-TH",{
      maximumFractionDigits:2
    }) + " บาท";
  }else{
    price.textContent = "สอบถามราคา";
  }

  const countryName =
    country.options[country.selectedIndex].text;

  if(countryCode !== "usa"){
    delivery.textContent =
      countryName + " · ติดต่อแอดมินเพื่อตรวจสอบราคา";
  }else{
    delivery.textContent =
      countryName + " · " +
      (service.value === "normal"
        ? "เรทปกติ 7–20 วัน"
        : "เรทด่วน 5–7 วัน");
  }
}

function contactAdmin(){
  window.open(
    "https://line.me/R/ti/p/@710rkcan",
    "_blank",
    "noopener"
  );
}

country.addEventListener("change",updatePrice);
service.addEventListener("change",updateWeights);
weight.addEventListener("change",updatePrice);
document.getElementById("contactButton")
  .addEventListener("click",contactAdmin);

updateWeights();
</script>
</body>
</html>
