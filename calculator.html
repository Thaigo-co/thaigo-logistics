
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxI64cbohyMo_ZXNk173k18nJIJcBRZvfECZY7tnrkltazJN22rwAGCkGdcLJOiXNzC/exec";

let prices = {};

const country = document.getElementById("country");
const service = document.getElementById("service");
const weight = document.getElementById("weight");
const price = document.getElementById("price");
const delivery = document.getElementById("delivery");

async function loadPrices() {
  price.textContent = "กำลังโหลดราคา...";

  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error("โหลดราคาไม่สำเร็จ");

    const data = await response.json();

    if (data.error || !data.prices) {
      throw new Error(data.error || "ไม่พบข้อมูลราคา");
    }

    prices = data.prices;
    updatePrice();

  } catch (error) {
    console.error("Price API error:", error);
    price.textContent = "โหลดราคาไม่สำเร็จ";
    delivery.textContent = "กรุณาติดต่อแอดมินทาง LINE";
  }
}

function updateWeights() {
  const max = service.value === "normal" ? 6 : 20;
  const previousWeight = Number(weight.value) || 1;

  weight.innerHTML = "";

  for (let i = 1; i <= max; i++) {
    const option = document.createElement("option");
    option.value = String(i);
    option.textContent = i + " กิโลกรัม";
    weight.appendChild(option);
  }

  weight.value = String(Math.min(previousWeight, max));
  updatePrice();
}

function updatePrice() {
  const countryCode = country.value;
  const selectedService = service.value;
  const selectedWeight = weight.value;

  const amount =
    prices[countryCode]?.[selectedService]?.[selectedWeight];

  if (typeof amount === "number" && Number.isFinite(amount)) {
    price.textContent = amount.toLocaleString("th-TH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " บาท";
  } else {
    price.textContent = "สอบถามราคา";
  }

  const countryName =
    country.options[country.selectedIndex]?.text || countryCode;

  delivery.textContent = countryCode !== "usa"
    ? countryName + " · ติดต่อแอดมินเพื่อตรวจสอบราคา"
    : countryName + " · " +
      (selectedService === "normal"
        ? "เรทปกติ 7–20 วัน"
        : "เรทด่วน 5–7 วัน");
}

function contactAdmin() {
  window.open(
    "https://line.me/R/ti/p/@710rkcan",
    "_blank",
    "noopener"
  );
}

function sendParcel() {
  const countryCode = country.value;
  const selectedService = service.value;
  const selectedWeight = weight.value;

  const amount =
    prices[countryCode]?.[selectedService]?.[selectedWeight];

  if (typeof amount !== "number" || !Number.isFinite(amount)) {
    alert("ยังไม่มีราคาสำหรับตัวเลือกนี้ กรุณาติดต่อแอดมิน");
    return;
  }

  const url = new URL("create-order.html", window.location.href);

  url.searchParams.set("country", countryCode);
  url.searchParams.set("service", selectedService);
  url.searchParams.set("weight", selectedWeight);
  url.searchParams.set("price", String(amount));

  window.location.href = url.toString();
}

country.addEventListener("change", updatePrice);
service.addEventListener("change", updateWeights);
weight.addEventListener("change", updatePrice);

document.getElementById("contactButton")
  .addEventListener("click", contactAdmin);

document.getElementById("sendParcelButton")
  .addEventListener("click", sendParcel);

updateWeights();
loadPrices();
</script>
